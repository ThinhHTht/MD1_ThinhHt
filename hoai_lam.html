<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      .container {
        width: 300px;
        height: 500px;
      }
      .image {
        height: 60%;
        position: relative;
      }
      img {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .icon-views {
        position: absolute;
        bottom: 0;
        height: 40px;
        width: 295px;
        background-color: rgb(0, 0, 0, 0.2);
        color: aliceblue;
        line-height: 40px;
        padding-left: 5px;
      }
      span{
        display: inline-block;
        padding-left: 5px;
      }
      .title{
        font-weight: bolder;
        padding-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="image">
        <img
          src="https://nguoinoitieng.vn/wp-content/uploads/2019/08/tieu-su-cua-ca-si-hoai-lam.jpg"
          alt="hoai lam"
        />
        <div class="icon-views">
          <i class="fa-regular fa-eye"></i>
          <span>9000 lượt xem</span>
        </div>
      </div>
      <div class="title">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Commodi, nobis.
        Accusantium ad modi labore dolorem.
      </div>
    </div>
  </body>
</html>
