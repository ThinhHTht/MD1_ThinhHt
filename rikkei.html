<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/all.min.css">
    <style>
        .container{
            font-family: Arial, Helvetica, sans-serif;
            width: 300px;
            height: 500px;
            position: relative;
        }
        img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .content{
            position: absolute;
            bottom: 20px;
            left: 15px;
            color: azure;
            z-index: 2;
        }
        .container::after{
            content: '';
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background-image: linear-gradient(to bottom, rgb(255, 251, 251), rgba(8, 8, 8,0.7)
            );
            z-index: 1;
        }
        p{
            padding-right: 20px;
        }
        a{
            text-decoration: none;
            font-weight: bolder;
            color: aliceblue;
        }
        i{
            border: 2px solid white;
            border-radius: 50%;
            padding: 2px;
            display: inline-block;
            margin-left: 5px;
        }

    </style>

  </head>
  <body>
    <div class="container">
      <img
        src="https://japan.rikkei.edu.vn/wp-content/uploads/2024/02/Hoc-vien-Dao-tao-Cong-nghe-Rikkei-Academy-min-scaled.jpg"
        alt="rikkei"
      />
      <div class="content">
        <h3>Latest thinking</h3>
        <p>Lorem ipsum dolor sit amet consectetur.</p>
        <p><a href="#">Explore <i class="fa-solid fa-chevron-right"></i> </a></p>
      </div>
    </div>
  </body>
</html>
