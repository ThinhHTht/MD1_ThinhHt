<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .full-name {
        display: flex;
      }
      .container {
        width: 60%;
        margin: auto;
        border-radius: 10px;
        background-color: rgb(131, 147, 147);
        padding: 20px;
      }
      .last-name {
        margin-left: 35px;
      }
      input {
        height: 20px;
      }

      .prefix-name {
        border: 1px solid rgb(35, 35, 35);
        border-radius: 2px;
        display: flex;
        overflow: hidden;
        height: 24px;
      }

      .pre-fix {
        background-color: gainsboro;
        padding-left: 5px;
        padding-right: 5px;
      }
      .input-box {
        border: none;
        outline: none;
        width: 100%;
        height: 24px;
      }
      .country-state {
        display: flex;
      }
      .card-infor {
        display: flex;
      }
      .card-date {
        display: flex;
      }
      fieldset {
        border: none;
        padding: 0;
        border: 0;
      }
      #country,
      #state {
        height: 26px;
      }
      .credit-card-radio,
      .debit-card-radio,
      .paypal-radio {
        display: flex;
        align-items: center;
      }
            .credit-card-radio label,
      .debit-card-radio label,
      .paypal-radio label{
        height: 20px;
        margin-top: 6px;
     
        
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h4>Billing address</h4>
      <form action="#">
        <div class="full-name">
          <div>
            <label for="first-name">First name</label><br />
            <input type="text" id="first-name" name="first-name" size="48" />
          </div>
          <div class="last-name">
            <label for="last-name">Last name</label><br />
            <input type="text" id="last-name" name="last-name" size="48" />
          </div>
        </div>
        <div>
          <label for="user-name">User name</label><br />
          <div class="prefix-name">
            <div class="pre-fix">@</div>
            <div class="user-name-input">
              <input
                class="input-box"
                type="text"
                id="user-name"
                name="user-name"
                size="103"
                placeholder="user name"
              />
            </div>
          </div>
        </div>
        <div>
          <label for="email">Email <span>(Optional)</span></label
          ><br />
          <input
            type="text"
            id="email"
            name="email"
            size="108"
            placeholder="you@example.com"
          />
        </div>
        <div>
          <label for="address">Address</label><br />
          <input
            type="text"
            id="address"
            name="address"
            size="108"
            placeholder="1234 Main str"
          />
        </div>
        <div>
          <label for="address-2">Address 2 <span>(Optional)</span></label
          ><br />
          <input
            type="text"
            id="address-2"
            name="address-2"
            size="108"
            placeholder="Apartment or suite"
          />
        </div>
        <div class="country-state">
          <div>
            <label for="country">Country</label><br />
            <select name="country" id="country">
              <option value="default">Choose...</option>
              <option value="vietnam">Việt Nam</option>
              <option value="japan">Nhật Bản</option>
            </select>
          </div>
          <div>
            <label for="state">State</label><br />
            <select name="state" id="state">
              <option value="default">Choose...</option>
              <option value="california">California</option>
              <option value="texas">Texas</option>
            </select>
          </div>
          <div>
            <label for="zip">Zip</label><br />
            <input type="text" id="zip" name="zip" />
          </div>
        </div>
        <div>
          <hr />
          <input
            type="checkbox"
            id="is-shipping-address"
            name="is-shipping-address"
          /><label for="is-shipping-address"
            >Shipping address is the same as my billing address</label
          ><br />
          <input type="checkbox" id="save-infor" name="save-infor" /><label
            for="save-infor"
            >Save this information for next time</label
          ><br />
          <hr />
        </div>
        <div>
          <fieldset>
            <legend>Payment</legend>
            <div class="credit-card-radio">
              <input
                type="radio"
                id="credit-card"
                name="payment-method"
                value="credit-card"
                checked
              /><label for="credit-card">Credit card</label><br />
            </div>
            <div class="debit-card-radio">
              <input
                type="radio"
                id="debit-card"
                name="payment-method"
                value="debit-card"
              /><label for="debit-card">Debit card</label><br />
            </div>
            <div class="paypal-radio">
              <input
                type="radio"
                id="pay-pal"
                name="payment-method"
                value="pay-pal"
              />
              <label for="pay-pal">PayPal</label>
            </div>
            <div class="card-infor">
              <div>
                <label for="name-on-card">Name on card</label><br />
                <input
                  type="text"
                  id="name-on-card"
                  name="name-on-card"
                  size="48"
                /><br />
                <p>Full name as displayed on card</p>
              </div>
              <div>
                <label for="credit-card-number">Credit card number</label><br />
                <input
                  type="text"
                  id="credit-card-number"
                  name="credit-card-number"
                  size="48"
                />
              </div>
            </div>
            <div class="card-date">
              <div>
                <label for="card-expiration">Expiration</label><br />
                <input
                  type="text"
                  id="card-expiration"
                  name="card-expiration"
                  size="20"
                />
              </div>
              <div>
                <label for="cvv">CVV</label><br />
                <input type="text" id="cvv" name="cvv" size="20" />
              </div>
            </div>
          </fieldset>
        </div>
        <hr />
        <button type="submit">Continue to checkout</button>
      </form>
    </div>
  </body>
</html>
