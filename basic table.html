<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .color {
        background-color: yellow;
        text-align: center;
      }
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
      .container {
        display: flex;
        justify-content: space-between;
        margin-left: 10px;
        margin-right: 10px;
      }
      .orange {
        background-color: orange;
      }
    </style>
  </head>
  <body>

      <h1 style="text-align: center; color: blue; text-transform: capitalize">
        Thời khóa biểu
      </h1>

        <p class="container">
          <span class="left">Lớp 1</span>
          <span class="right">Thời gian: 10h</span>
        </p>

        </p>
        <p style="margin-left: 10px">Phòng học: 1A</p>
      </div>

      <table style="margin: auto; width: 100%">
        <tr>
          <th colspan="3" style="width: 40%"></th>
          <th class="color">Thứ 3</th>
          <th class="color">Thứ 5</th>
          <th class="color">Thứ 7</th>
        </tr>
        <tr class="orange">
          <th>Tuần</th>
          <th>Ngày bắt đầu</th>
          <th>Ngày kết thúc</th>
          <th colspan="3">Môn học</th>
        </tr>
        <tr>
          <td style="text-align: center;">01</td>
          <td>10/06/2020</td>
          <td>10/10/2020</td>
          <td>css</td>
          <td>html</td>
          <td>js</td>
        </tr>
        <tr>
          <td style="text-align: center;">02</td>
          <td>10/06/2020</td>
          <td>10/10/2020</td>
          <td>d</td>
          <td>e</td>
          <td>f</td>
        </tr>
        <tr>
          <td style="text-align: center;">03</td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
          <td></td>
        </tr>
      </table>
    </div>
  </body>
</html>
