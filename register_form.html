<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .container{
            margin: auto;
            width: 50%;
        }
        .fieldset{
            border: none;
            padding: 0%;
            margin: 0%;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <form action="">
        <label for="full-name">Họ và tên:</label><br />
        <input type="text" id="full-name" name="full name" /><br />
        <label for="email">Email:</label><br />
        <input type="text" id="email" name="email" /><br />
        <label for="phone-number">Số điện thoại:</label><br />
        <input type="text" id="phone-number" name="phone" /><br />
        <fieldset class="fieldset">
          <legend>Giới tính:</legend>
          <input type="radio" id="male" name="gender" value="male" checked><label for="male">Nam</label>
          <input type="radio" id="female" name="gender" value="female"><label for="female">Nữ</label>
        </fieldset>
        <button type="submit">Đăng ký</button>
      </form>
    </div>
  </body>
</html>
