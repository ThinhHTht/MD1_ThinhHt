<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      :root {
        --main-font: "Courier New", Courier, monospace;
      }
      div {
        margin: 50px auto;
        font-family: var(--main-font);
        width: 300px;
        height: 200px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-weight: 400;
        font-size: 3rem;
        color: azure;
        transition: all 0.2s;
        background-color: grey;
        box-sizing: border-box;
        transition: all 0.2s;
      }
      div:hover {
        border: 20px solid rgb(48, 152, 197);
      }
    </style>
  </head>
  <body>
    <div>inset border</div>
  </body>
</html>
